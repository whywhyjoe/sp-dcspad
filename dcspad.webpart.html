<!-- DCSPad web-part entry.
     The Modern Script Editor web part's "Script URL" points at this file
     (its external mode fetches an HTML file and injects it, re-creating
     script tags). It should never need to change: all boot logic lives in
     boot.js, which resolves the library folder from its own src URL. The
     one absolute URL below is the only site-specific line in the app.
-->
<!-- The ?v= on boot.js exists because SharePoint serves library files with
     max-age=86400: bump it whenever boot.js changes, or browsers keep the
     old boot for up to a day. Everything below boot.js self-versions. -->
<div data-dcspad-anchor></div>
<script src="https://nervedotnet.sharepoint.com/sites/NewNerve/SiteAssets/Code/dcspad-live/boot.js?v=9"></script>
